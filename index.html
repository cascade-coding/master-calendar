<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f5f5f5;
        color: #111;
      }

      .calendar-wrapper {
        width: min(1400px, 96vw);
        margin: 30px auto;
      }

      /* Header */

      .calendar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .month-title {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      .month-title h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -1px;
      }

      .year {
        font-size: 20px;
        color: #777;
        font-weight: 500;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button {
        border: 1px solid #ddd;
        background: white;
        color: #111;
        padding: 9px 14px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s ease;
      }

      button:hover {
        background: #eee;
      }

      .nav-button {
        width: 40px;
        height: 40px;
        padding: 0;
        font-size: 20px;
      }

      /* Calendar */

      .calendar {
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        overflow: hidden;
      }

      /* Weekday names */

      .weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        background: #fafafa;
        border-bottom: 1px solid #ddd;
      }

      .weekday {
        padding: 14px;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Day grid */

      .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
      }

      .day {
        min-height: 150px;
        padding: 12px;
        border-right: 1px solid #ddd;
        border-bottom: 1px solid #ddd;
        position: relative;
        background: white;
        transition: background 0.15s ease;
      }

      /* Remove right border from every 7th cell */

      .day:nth-child(7n) {
        border-right: none;
      }

      /* Empty days */

      .day.empty {
        background: #fafafa;
      }

      /* Day number */

      .day-number {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 14px;
        font-weight: 600;
      }

      .day.past {
        background: #eeeeee;
        opacity: 0.7;
      }

      /* .day.past .day-number {
        color: #;
      } */

      /* Today's date */

      .day.today .day-number {
        background: #111;
        color: white;
      }

      .day.today {
        background: #fcfcfc;
      }

      /* Hover */

      .day:not(.empty):hover {
        background: #f8f8f8;
      }

      /* Responsive */

      @media (max-width: 800px) {
        .calendar-wrapper {
          width: 100%;
          margin: 0;
        }

        .calendar-header {
          padding: 15px;
        }

        .month-title h1 {
          font-size: 24px;
        }

        .year {
          font-size: 16px;
        }

        .day {
          min-height: 100px;
          padding: 7px;
        }

        .weekday {
          padding: 10px 4px;
          font-size: 10px;
        }
      }

      @media (max-width: 500px) {
        .calendar-header {
          flex-wrap: wrap;
          gap: 15px;
        }

        .day {
          min-height: 75px;
        }

        .day-number {
          width: 25px;
          height: 25px;
          font-size: 12px;
        }

        .controls button:first-child {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="calendar-wrapper">
      ```
      <header class="calendar-header">
        <div class="month-title">
          <h1 id="monthName"></h1>
          <span class="year" id="year"></span>
        </div>

        <div class="controls">
          <button id="todayBtn">Today</button>

          <button class="nav-button" id="prevBtn" aria-label="Previous month">
            ‹
          </button>

          <button class="nav-button" id="nextBtn" aria-label="Next month">
            ›
          </button>
        </div>
      </header>

      <section class="calendar">
        <!-- Monday is now the first weekday -->

        <div class="weekdays">
          <div class="weekday">Monday</div>
          <div class="weekday">Tuesday</div>
          <div class="weekday">Wednesday</div>
          <div class="weekday">Thursday</div>
          <div class="weekday">Friday</div>
          <div class="weekday">Saturday</div>
          <div class="weekday">Sunday</div>
        </div>

        <div class="days" id="days"></div>
      </section>
      ```
    </main>

    <script>
      const monthName = document.getElementById("monthName");
      const yearElement = document.getElementById("year");
      const daysContainer = document.getElementById("days");

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const todayBtn = document.getElementById("todayBtn");

      // The month currently being viewed

      let currentDate = new Date();

      function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        // -----------------------------
        // Display month and year
        // -----------------------------

        const monthFormatter = new Intl.DateTimeFormat("en-US", {
          month: "long",
        });

        monthName.textContent = monthFormatter.format(currentDate);
        yearElement.textContent = year;

        // Clear existing days

        daysContainer.innerHTML = "";

        // -----------------------------
        // Get information about the month
        // -----------------------------

        const firstDay = new Date(year, month, 1);

        const lastDay = new Date(year, month + 1, 0);

        const daysInMonth = lastDay.getDate();

        // JavaScript:
        //
        // Sunday    = 0
        // Monday    = 1
        // Tuesday   = 2
        // Wednesday = 3
        // Thursday  = 4
        // Friday    = 5
        // Saturday  = 6
        //
        // We convert it so:
        //
        // Monday    = 0
        // Tuesday   = 1
        // ...
        // Sunday    = 6

        const startingDay = (firstDay.getDay() + 6) % 7;

        // -----------------------------
        // Empty cells before the 1st
        // -----------------------------

        for (let i = 0; i < startingDay; i++) {
          const emptyDay = document.createElement("div");

          emptyDay.classList.add("day", "empty");

          daysContainer.appendChild(emptyDay);
        }

        // -----------------------------
        // Create the actual days
        // -----------------------------

        const today = new Date();

        for (let day = 1; day <= daysInMonth; day++) {
          const dayElement = document.createElement("div");

          dayElement.classList.add("day");

          // Check whether this day is today

          const isToday =
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear();

          const isPast =
            new Date(year, month, day) <
            new Date(today.getFullYear(), today.getMonth(), today.getDate());

          if (isToday) {
            dayElement.classList.add("today");
          }

          if (isPast) {
            dayElement.classList.add("past");
          }

          // Day number

          const number = document.createElement("div");

          number.classList.add("day-number");

          number.textContent = day;

          dayElement.appendChild(number);

          daysContainer.appendChild(dayElement);
        }

        // -----------------------------
        // Empty cells after the last day
        // -----------------------------

        const totalCells = startingDay + daysInMonth;

        const remainingCells = (7 - (totalCells % 7)) % 7;

        for (let i = 0; i < remainingCells; i++) {
          const emptyDay = document.createElement("div");

          emptyDay.classList.add("day", "empty");

          daysContainer.appendChild(emptyDay);
        }
      }

      // -----------------------------
      // Previous month
      // -----------------------------

      prevBtn.addEventListener("click", () => {
        currentDate.setMonth(currentDate.getMonth() - 1);

        renderCalendar();
      });

      // -----------------------------
      // Next month
      // -----------------------------

      nextBtn.addEventListener("click", () => {
        currentDate.setMonth(currentDate.getMonth() + 1);

        renderCalendar();
      });

      // -----------------------------
      // Today button
      // -----------------------------

      todayBtn.addEventListener("click", () => {
        currentDate = new Date();

        renderCalendar();
      });

      // -----------------------------
      // Initial render
      // -----------------------------

      renderCalendar();
    </script>
  </body>
</html>
