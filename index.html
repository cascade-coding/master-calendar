<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Master Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: linear-gradient(145deg, #f6f9fc 0%, #eef2f7 100%);
        padding: 20px;
      }

      .calendar-wrapper {
        width: min(1300px, 96vw);
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(4px);
        border-radius: 40px;
        padding: 32px 32px 40px;
        box-shadow:
          0 25px 50px -12px rgba(0, 20, 40, 0.25),
          0 4px 18px 0 rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.5);
        transition: all 0.2s;
      }

      /* ----- header ----- */
      .calendar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
        flex-wrap: wrap;
        gap: 16px 24px;
      }

      .month-title {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      .month-title h1 {
        margin: 0;
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #1a2a3a, #2c3e5a);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .year {
        font-size: 1.4rem;
        font-weight: 500;
        color: #6b7e95;
        letter-spacing: 0.02em;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .controls button {
        border: none;
        background: white;
        color: #1e2b3c;
        padding: 10px 18px;
        border-radius: 60px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
        box-shadow:
          0 4px 10px rgba(0, 0, 0, 0.02),
          0 2px 6px rgba(0, 20, 30, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(2px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .controls button:hover {
        background: #ffffff;
        box-shadow: 0 12px 24px -8px rgba(20, 60, 100, 0.18);
        transform: translateY(-2px);
        border-color: #b0c8dd;
      }

      .controls button:active {
        transform: scale(0.96);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      }

      .nav-button {
        width: 44px;
        height: 44px;
        padding: 0;
        font-size: 24px;
        font-weight: 300;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 40px;
        line-height: 1;
        color: #1f3448;
      }

      .nav-button:hover {
        background: white;
      }

      #todayBtn {
        background: #1f3448;
        color: white;
        border: none;
        padding: 10px 22px;
        font-weight: 600;
        letter-spacing: 0.2px;
        box-shadow: 0 6px 14px rgba(26, 45, 70, 0.2);
      }

      #todayBtn:hover {
        background: #2a405a;
        box-shadow: 0 10px 24px -6px rgba(20, 50, 90, 0.3);
        border-color: transparent;
      }

      /* ----- calendar grid ----- */
      .calendar {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(2px);
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 8px 24px rgba(0, 20, 40, 0.04);
      }

      .weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        background: rgba(240, 246, 252, 0.7);
        backdrop-filter: blur(2px);
        border-bottom: 1px solid rgba(200, 215, 230, 0.3);
        padding: 0 4px;
      }

      .weekday {
        padding: 18px 4px 14px;
        text-align: center;
        font-size: 0.8rem;
        font-weight: 700;
        color: #4a617c;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.8;
      }

      .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        background: rgba(255, 255, 255, 0.3);
        gap: 1px;
        background-color: rgba(200, 215, 230, 0.25);
        padding: 1px;
      }

      .day {
        min-height: 140px;
        padding: 14px 10px;
        background: white;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
        position: relative;
        backdrop-filter: blur(2px);
        border-radius: 0;
      }

      .day:not(.empty):hover {
        background: #f2f8ff;
        z-index: 2;
        box-shadow: inset 0 0 0 1px rgba(70, 130, 200, 0.15);
      }

      .day.empty {
        background: rgba(245, 250, 255, 0.3);
        backdrop-filter: blur(2px);
      }

      .day-number {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 40px;
        font-size: 0.95rem;
        font-weight: 600;
        color: #1e2f40;
        transition: 0.15s;
      }

      /* past days */
      .day.past {
        background: #f4f8fd;
        opacity: 0.75;
      }
      .day.past .day-number {
        color: #6f88a0;
        font-weight: 500;
      }

      /* today — vibrant */
      .day.today {
        background: #e5eff9;
        box-shadow: inset 0 0 0 2px #1f3448;
        border-radius: 4px;
        z-index: 3;
      }
      .day.today .day-number {
        background: #1f3448;
        color: white;
        font-weight: 700;
        box-shadow: 0 4px 12px rgba(26, 50, 80, 0.25);
        transform: scale(1.02);
      }

      .day:not(.empty):active {
        transform: scale(0.98);
      }

      /* responsive */
      @media (max-width: 900px) {
        .calendar-wrapper {
          padding: 20px 16px 28px;
          border-radius: 28px;
        }
        .month-title h1 {
          font-size: 1.8rem;
        }
        .year {
          font-size: 1.2rem;
        }
        .day {
          min-height: 110px;
          padding: 10px 6px;
        }
        .day-number {
          width: 32px;
          height: 32px;
          font-size: 0.85rem;
        }
      }

      @media (max-width: 650px) {
        .calendar-header {
          flex-direction: column;
          align-items: stretch;
        }
        .controls {
          justify-content: flex-end;
        }
        .weekday {
          padding: 12px 2px 10px;
          font-size: 0.65rem;
          letter-spacing: 0.04em;
        }
        .day {
          min-height: 80px;
          padding: 8px 4px;
        }
        .day-number {
          width: 28px;
          height: 28px;
          font-size: 0.8rem;
        }
        .controls button {
          padding: 6px 14px;
          font-size: 0.8rem;
        }
        .nav-button {
          width: 38px;
          height: 38px;
          font-size: 20px;
        }
        #todayBtn {
          padding: 6px 16px;
          font-size: 0.8rem;
        }
        .calendar-wrapper {
          padding: 16px 10px 20px;
        }
      }

      @media (max-width: 450px) {
        .day {
          min-height: 64px;
          padding: 4px 3px;
        }
        .day-number {
          width: 24px;
          height: 24px;
          font-size: 0.7rem;
        }
        .weekday {
          padding: 8px 2px 6px;
          font-size: 0.55rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="calendar-wrapper">
      <header class="calendar-header">
        <div class="month-title">
          <h1 id="monthName">January</h1>
          <span class="year" id="year">2026</span>
        </div>
        <div class="controls">
          <button id="todayBtn">📅 Today</button>
          <button class="nav-button" id="prevBtn" aria-label="Previous month">
            ‹
          </button>
          <button class="nav-button" id="nextBtn" aria-label="Next month">
            ›
          </button>
        </div>
      </header>

      <section class="calendar">
        <div class="weekdays">
          <div class="weekday">Monday</div>
          <div class="weekday">Tuesday</div>
          <div class="weekday">Wednesday</div>
          <div class="weekday">Thursday</div>
          <div class="weekday">Friday</div>
          <div class="weekday">Saturday</div>
          <div class="weekday">Sunday</div>
        </div>
        <div class="days" id="days"></div>
      </section>
    </main>

    <script>
      (function () {
        const monthName = document.getElementById("monthName");
        const yearElement = document.getElementById("year");
        const daysContainer = document.getElementById("days");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const todayBtn = document.getElementById("todayBtn");

        let currentDate = new Date();

        function renderCalendar() {
          const year = currentDate.getFullYear();
          const month = currentDate.getMonth();

          const monthFormatter = new Intl.DateTimeFormat("en-US", {
            month: "long",
          });
          monthName.textContent = monthFormatter.format(currentDate);
          yearElement.textContent = year;

          daysContainer.innerHTML = "";

          const firstDay = new Date(year, month, 1);
          const lastDay = new Date(year, month + 1, 0);
          const daysInMonth = lastDay.getDate();

          // Monday = 0 ... Sunday = 6
          const startingDay = (firstDay.getDay() + 6) % 7;

          // empty cells before first day
          for (let i = 0; i < startingDay; i++) {
            const empty = document.createElement("div");
            empty.className = "day empty";
            daysContainer.appendChild(empty);
          }

          const today = new Date();
          const todayDate = today.getDate();
          const todayMonth = today.getMonth();
          const todayYear = today.getFullYear();

          for (let day = 1; day <= daysInMonth; day++) {
            const dayElement = document.createElement("div");
            dayElement.className = "day";

            const isToday =
              day === todayDate && month === todayMonth && year === todayYear;
            const isPast =
              new Date(year, month, day) <
              new Date(todayYear, todayMonth, todayDate);

            if (isToday) dayElement.classList.add("today");
            if (isPast) dayElement.classList.add("past");

            const number = document.createElement("div");
            number.className = "day-number";
            number.textContent = day;
            dayElement.appendChild(number);

            daysContainer.appendChild(dayElement);
          }

          // empty cells after last day
          const totalCells = startingDay + daysInMonth;
          const remaining = (7 - (totalCells % 7)) % 7;
          for (let i = 0; i < remaining; i++) {
            const empty = document.createElement("div");
            empty.className = "day empty";
            daysContainer.appendChild(empty);
          }
        }

        prevBtn.addEventListener("click", () => {
          currentDate.setMonth(currentDate.getMonth() - 1);
          renderCalendar();
        });

        nextBtn.addEventListener("click", () => {
          currentDate.setMonth(currentDate.getMonth() + 1);
          renderCalendar();
        });

        todayBtn.addEventListener("click", () => {
          currentDate = new Date();
          renderCalendar();
        });

        renderCalendar();
      })();
    </script>
  </body>
</html>
