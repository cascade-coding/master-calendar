<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Master Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: linear-gradient(145deg, #f6f9fc 0%, #eef2f7 100%);
        padding: 16px;
      }

      .calendar-wrapper {
        width: min(1300px, 96vw);
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(4px);
        border-radius: 40px;
        padding: 32px 32px 40px;
        box-shadow:
          0 25px 50px -12px rgba(0, 20, 40, 0.25),
          0 4px 18px 0 rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.5);
        transition: all 0.2s;
      }

      /* ----- header ----- */
      .calendar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
        flex-wrap: wrap;
        gap: 16px 24px;
      }

      .month-title {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      .month-title h1 {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #1a2a3a, #2c3e5a);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .year {
        font-size: clamp(1rem, 2vw, 1.4rem);
        font-weight: 500;
        color: #6b7e95;
        letter-spacing: 0.02em;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .controls button {
        border: none;
        background: white;
        color: #1e2b3c;
        padding: 10px 18px;
        border-radius: 60px;
        font-size: clamp(0.75rem, 1.2vw, 0.95rem);
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
        box-shadow:
          0 4px 10px rgba(0, 0, 0, 0.02),
          0 2px 6px rgba(0, 20, 30, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(2px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }

      .controls button:hover {
        background: #ffffff;
        box-shadow: 0 12px 24px -8px rgba(20, 60, 100, 0.18);
        transform: translateY(-2px);
        border-color: #b0c8dd;
      }

      .controls button:active {
        transform: scale(0.96);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      }

      .nav-button {
        width: clamp(38px, 5vw, 44px);
        height: clamp(38px, 5vw, 44px);
        padding: 0;
        font-size: clamp(20px, 3vw, 24px);
        font-weight: 300;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 40px;
        line-height: 1;
        color: #1f3448;
      }

      .nav-button:hover {
        background: white;
      }

      #todayBtn {
        background: #1f3448;
        color: white;
        border: none;
        padding: 10px 22px;
        font-weight: 600;
        letter-spacing: 0.2px;
        box-shadow: 0 6px 14px rgba(26, 45, 70, 0.2);
      }

      #todayBtn:hover {
        background: #2a405a;
        box-shadow: 0 10px 24px -6px rgba(20, 50, 90, 0.3);
        border-color: transparent;
      }

      /* ----- calendar grid ----- */
      .calendar {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(2px);
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 8px 24px rgba(0, 20, 40, 0.04);
      }

      /* ----- IMPROVED WEEKDAY HEADER ----- */
      .weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        background: linear-gradient(135deg, #1a2a3a 0%, #2c3e5a 100%);
        padding: 0;
        position: relative;
        overflow: hidden;
      }

      /* Add a subtle top highlight */
      .weekdays::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, 
          rgba(255,255,255,0.1) 0%, 
          rgba(255,255,255,0.3) 50%, 
          rgba(255,255,255,0.1) 100%
        );
      }

      /* Add a subtle bottom shadow */
      .weekdays::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, 
          rgba(255,255,255,0) 0%, 
          rgba(255,255,255,0.15) 50%, 
          rgba(255,255,255,0) 100%
        );
      }

      .weekday {
        padding: clamp(14px, 2vw, 20px) 4px clamp(12px, 1.5vw, 16px);
        text-align: center;
        font-size: clamp(0.6rem, 1vw, 0.85rem);
        font-weight: 700;
        color: rgba(255, 255, 255, 0.9);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        position: relative;
        transition: all 0.3s ease;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }

      /* Remove border from last item */
      .weekday:last-child {
        border-right: none;
      }

      /* Add subtle hover effect */
      .weekday:hover {
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 1);
        transform: scale(1.02);
      }

      /* Add a subtle indicator for weekend days */
      .weekday:nth-child(6),
      .weekday:nth-child(7) {
        color: rgba(255, 255, 255, 0.75);
        letter-spacing: 0.1em;
      }

      /* Add a subtle glow to weekend days */
      .weekday:nth-child(6)::after,
      .weekday:nth-child(7)::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 20%;
        right: 20%;
        height: 2px;
        background: linear-gradient(90deg, 
          transparent, 
          rgba(255, 215, 0, 0.2), 
          transparent
        );
        border-radius: 2px;
      }

      /* Style for full and short names */
      .weekday .full {
        display: inline;
      }
      .weekday .short {
        display: none;
      }

      /* ----- DAY GRID ----- */
      .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        background: rgba(255, 255, 255, 0.3);
        gap: 1px;
        background-color: rgba(200, 215, 230, 0.25);
        padding: 1px;
      }

      .day {
        min-height: clamp(70px, 12vw, 140px);
        padding: clamp(8px, 1.2vw, 14px) clamp(6px, 1vw, 12px);
        background: white;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
        position: relative;
        backdrop-filter: blur(2px);
        border-radius: 0;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }

      .day:not(.empty):hover {
        background: #f2f8ff;
        z-index: 2;
        box-shadow: inset 0 0 0 1px rgba(70, 130, 200, 0.15);
      }

      .day.empty {
        background: rgba(245, 250, 255, 0.3);
        backdrop-filter: blur(2px);
      }

      .day-number {
        width: clamp(28px, 4vw, 36px);
        height: clamp(28px, 4vw, 36px);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 40px;
        font-size: clamp(0.7rem, 1.1vw, 0.95rem);
        font-weight: 600;
        color: #1e2f40;
        transition: 0.15s;
        flex-shrink: 0;
      }

      /* past days */
      .day.past {
        background: #f4f8fd;
        opacity: 0.75;
      }
      .day.past .day-number {
        color: #6f88a0;
        font-weight: 500;
      }

      /* today — vibrant */
      .day.today {
        background: #e5eff9;
        box-shadow: inset 0 0 0 2px #1f3448;
        border-radius: 4px;
        z-index: 3;
      }
      .day.today .day-number {
        background: #1f3448;
        color: white;
        font-weight: 700;
        box-shadow: 0 4px 12px rgba(26, 50, 80, 0.25);
        transform: scale(1.02);
      }

      .day:not(.empty):active {
        transform: scale(0.98);
      }

      /* Responsive breakpoints */
      @media (max-width: 768px) {
        .calendar-wrapper {
          padding: 20px 14px 24px;
          border-radius: 28px;
        }

        .calendar-header {
          margin-bottom: 20px;
          gap: 12px;
        }

        .controls button {
          padding: 8px 14px;
        }

        #todayBtn {
          padding: 8px 16px;
        }

        .weekday .full {
          display: none;
        }
        .weekday .short {
          display: inline;
        }

        .weekday {
          padding: clamp(10px, 1.5vw, 14px) 2px clamp(8px, 1.2vw, 10px);
          font-size: clamp(0.5rem, 1.2vw, 0.65rem);
          letter-spacing: 0.06em;
        }

        .day {
          min-height: clamp(65px, 10vw, 90px);
          padding: 8px 4px;
        }

        .day-number {
          width: clamp(24px, 3.5vw, 30px);
          height: clamp(24px, 3.5vw, 30px);
          font-size: clamp(0.65rem, 1vw, 0.8rem);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 10px;
        }

        .calendar-wrapper {
          padding: 14px 8px 18px;
          border-radius: 20px;
          width: 100%;
        }

        .calendar-header {
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
          margin-bottom: 14px;
        }

        .month-title {
          justify-content: center;
        }

        .month-title h1 {
          font-size: clamp(1.3rem, 5vw, 1.6rem);
        }

        .year {
          font-size: clamp(0.9rem, 2.5vw, 1rem);
        }

        .controls {
          justify-content: center;
        }

        .controls button {
          padding: 6px 12px;
          font-size: clamp(0.65rem, 2vw, 0.75rem);
        }

        .nav-button {
          width: clamp(32px, 8vw, 38px);
          height: clamp(32px, 8vw, 38px);
          font-size: clamp(16px, 4vw, 20px);
        }

        #todayBtn {
          padding: 6px 12px;
          font-size: clamp(0.65rem, 2vw, 0.75rem);
        }

        .calendar {
          border-radius: 16px;
        }

        .weekday {
          padding: clamp(6px, 1vw, 8px) 2px clamp(5px, 0.8vw, 6px);
          font-size: clamp(0.45rem, 1.5vw, 0.55rem);
          letter-spacing: 0.04em;
        }

        .weekday:nth-child(6)::after,
        .weekday:nth-child(7)::after {
          display: none;
        }

        .days {
          gap: 1px;
          padding: 1px;
        }

        .day {
          min-height: clamp(50px, 12vw, 64px);
          padding: 6px 3px;
        }

        .day-number {
          width: clamp(20px, 5vw, 26px);
          height: clamp(20px, 5vw, 26px);
          font-size: clamp(0.6rem, 1.8vw, 0.7rem);
        }

        .day.today {
          box-shadow: inset 0 0 0 1.5px #1f3448;
        }

        .day.today .day-number {
          box-shadow: 0 2px 8px rgba(26, 50, 80, 0.2);
        }

        .day:not(.empty):hover {
          background: #f2f8ff;
        }
      }

      @media (max-width: 360px) {
        .calendar-wrapper {
          padding: 10px 4px 14px;
          border-radius: 16px;
        }

        .day {
          min-height: clamp(42px, 10vw, 50px);
          padding: 4px 2px;
        }

        .day-number {
          width: clamp(18px, 4.5vw, 22px);
          height: clamp(18px, 4.5vw, 22px);
          font-size: clamp(0.5rem, 1.5vw, 0.6rem);
        }

        .weekday {
          padding: clamp(4px, 0.8vw, 6px) 1px clamp(3px, 0.6vw, 4px);
          font-size: clamp(0.4rem, 1.2vw, 0.45rem);
          letter-spacing: 0.02em;
        }

        .controls button {
          padding: 4px 8px;
          font-size: clamp(0.55rem, 1.8vw, 0.65rem);
        }

        .nav-button {
          width: clamp(28px, 7vw, 32px);
          height: clamp(28px, 7vw, 32px);
          font-size: clamp(14px, 3.5vw, 16px);
        }

        #todayBtn {
          padding: 4px 10px;
          font-size: clamp(0.55rem, 1.8vw, 0.65rem);
        }
      }
    </style>
  </head>
  <body>
    <main class="calendar-wrapper">
      <header class="calendar-header">
        <div class="month-title">
          <h1 id="monthName">January</h1>
          <span class="year" id="year">2026</span>
        </div>
        <div class="controls">
          <button id="todayBtn">📅 Today</button>
          <button class="nav-button" id="prevBtn" aria-label="Previous month">
            ‹
          </button>
          <button class="nav-button" id="nextBtn" aria-label="Next month">
            ›
          </button>
        </div>
      </header>

      <section class="calendar">
        <div class="weekdays">
          <div class="weekday">
            <span class="full">Monday</span>
            <span class="short">Mon</span>
          </div>
          <div class="weekday">
            <span class="full">Tuesday</span>
            <span class="short">Tue</span>
          </div>
          <div class="weekday">
            <span class="full">Wednesday</span>
            <span class="short">Wed</span>
          </div>
          <div class="weekday">
            <span class="full">Thursday</span>
            <span class="short">Thu</span>
          </div>
          <div class="weekday">
            <span class="full">Friday</span>
            <span class="short">Fri</span>
          </div>
          <div class="weekday">
            <span class="full">Saturday</span>
            <span class="short">Sat</span>
          </div>
          <div class="weekday">
            <span class="full">Sunday</span>
            <span class="short">Sun</span>
          </div>
        </div>
        <div class="days" id="days"></div>
      </section>
    </main>

    <script>
      (function () {
        const monthName = document.getElementById("monthName");
        const yearElement = document.getElementById("year");
        const daysContainer = document.getElementById("days");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const todayBtn = document.getElementById("todayBtn");

        let currentDate = new Date();

        function renderCalendar() {
          const year = currentDate.getFullYear();
          const month = currentDate.getMonth();

          const monthFormatter = new Intl.DateTimeFormat("en-US", {
            month: "long",
          });
          monthName.textContent = monthFormatter.format(currentDate);
          yearElement.textContent = year;

          daysContainer.innerHTML = "";

          const firstDay = new Date(year, month, 1);
          const lastDay = new Date(year, month + 1, 0);
          const daysInMonth = lastDay.getDate();

          // Monday = 0 ... Sunday = 6
          const startingDay = (firstDay.getDay() + 6) % 7;

          // empty cells before first day
          for (let i = 0; i < startingDay; i++) {
            const empty = document.createElement("div");
            empty.className = "day empty";
            daysContainer.appendChild(empty);
          }

          const today = new Date();
          const todayDate = today.getDate();
          const todayMonth = today.getMonth();
          const todayYear = today.getFullYear();

          for (let day = 1; day <= daysInMonth; day++) {
            const dayElement = document.createElement("div");
            dayElement.className = "day";

            const isToday =
              day === todayDate && month === todayMonth && year === todayYear;
            const isPast =
              new Date(year, month, day) <
              new Date(todayYear, todayMonth, todayDate);

            if (isToday) dayElement.classList.add("today");
            if (isPast) dayElement.classList.add("past");

            const number = document.createElement("div");
            number.className = "day-number";
            number.textContent = day;
            dayElement.appendChild(number);

            daysContainer.appendChild(dayElement);
          }

          // empty cells after last day
          const totalCells = startingDay + daysInMonth;
          const remaining = (7 - (totalCells % 7)) % 7;
          for (let i = 0; i < remaining; i++) {
            const empty = document.createElement("div");
            empty.className = "day empty";
            daysContainer.appendChild(empty);
          }
        }

        prevBtn.addEventListener("click", () => {
          currentDate.setMonth(currentDate.getMonth() - 1);
          renderCalendar();
        });

        nextBtn.addEventListener("click", () => {
          currentDate.setMonth(currentDate.getMonth() + 1);
          renderCalendar();
        });

        todayBtn.addEventListener("click", () => {
          currentDate = new Date();
          renderCalendar();
        });

        renderCalendar();
      })();
    </script>
  </body>
</html>
