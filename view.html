<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📆 Year Grid Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: linear-gradient(145deg, #f8fafc 0%, #eef2f7 100%);
        color: #1e293b;
        padding: 24px 0 40px;
        overflow-x: hidden;
      }

      /* ----- App Header ----- */
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .app-title {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .app-title .logo {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: 0 8px 24px -4px rgba(139, 92, 246, 0.35);
      }

      .app-title h1 {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #1e293b, #475569);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.1;
      }

      .app-title .subtitle {
        font-size: 0.7rem;
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-top: 2px;
      }

      .year-controls-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 60px;
        padding: 6px 6px 6px 20px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      }

      .year-controls-wrap .current-year {
        font-size: 1.05rem;
        font-weight: 700;
        color: #1e293b;
        letter-spacing: -0.01em;
        min-width: 46px;
        text-align: center;
      }

      .year-nav {
        display: flex;
        gap: 4px;
      }

      .year-nav button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background: #f1f5f9;
        color: #475569;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 400;
      }

      .year-nav button:hover {
        background: #6366f1;
        color: white;
        transform: scale(1.08);
      }

      .year-nav button:active {
        transform: scale(0.95);
      }

      .today-button {
        background: linear-gradient(135deg, #6366f1, #a855f7);
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 60px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 4px 14px rgba(139, 92, 246, 0.3);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .today-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(139, 92, 246, 0.5);
      }

      .today-button:active {
        transform: scale(0.96);
      }

      /* ----- Scroll hint ----- */
      .scroll-hint {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 28px;
        margin-bottom: 12px;
        font-size: 0.72rem;
        color: #94a3b8;
        font-weight: 500;
      }

      .scroll-hint span {
        display: inline-block;
        animation: slideX 2s infinite;
      }

      @keyframes slideX {
        0%,
        100% {
          transform: translateX(0);
          opacity: 0.6;
        }
        50% {
          transform: translateX(6px);
          opacity: 1;
        }
      }

      /* ----- Main scroll wrapper ----- */
      .calendar-scroll {
        overflow-x: auto;
        overflow-y: hidden;
        scroll-behavior: smooth;
        cursor: grab;
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 #f1f5f9;
        padding-bottom: 14px;
      }

      .calendar-scroll:active {
        cursor: grabbing;
      }

      .calendar-scroll::-webkit-scrollbar {
        height: 10px;
      }
      .calendar-scroll::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 10px;
        margin: 0 28px;
      }
      .calendar-scroll::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        border: 2px solid #f1f5f9;
      }
      .calendar-scroll::-webkit-scrollbar-thumb:hover {
        background: #6366f1;
      }

      /* ----- The full year grid ----- */
      .year-grid {
        display: flex;
        min-width: max-content;
        padding: 0 28px;
      }

      /* ----- Weekday labels (fixed left column) ----- */
      .weekday-labels {
        position: sticky;
        left: 0;
        z-index: 5;
        background: linear-gradient(145deg, #f8fafc 0%, #eef2f7 100%);
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
        padding-right: 12px;
        padding-left: 6px;
        /* Extra breathing room on the left when sticky */
        margin-right: 6px;
      }

      .weekday-labels .spacer {
        height: 42px;
        margin-bottom: 8px;
      }

      .weekday-labels .label-cell {
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-left: 8px;
        padding-right: 14px;
        font-size: 0.68rem;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 1px;
      }

      .weekday-labels .label-cell.weekend {
        color: #94a3b8;
      }

      /* ----- The main grid of weeks ----- */
      .weeks-grid {
        display: flex;
        flex: 0 0 auto;
      }

      /* ----- Month marker ----- */
      .month-marker-header {
        height: 42px;
        display: flex;
        align-items: center;
        padding-left: 10px;
        font-size: 0.82rem;
        font-weight: 800;
        color: #7c3aed;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        white-space: nowrap;
        position: relative;
        box-sizing: border-box;
        margin-bottom: 8px;
      }

      .month-marker-header::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        height: 2px;
        background: linear-gradient(90deg, #a855f7, #6366f1);
        width: 100%;
        border-radius: 2px;
      }

      /* ----- Week columns with 1px gap ----- */
      .weeks-row {
        display: flex;
        gap: 1px;
        background: #e2e8f0;
        padding: 1px;
        border-radius: 6px;
      }

      .week-col {
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
        gap: 1px;
        background: #e2e8f0;
        border-radius: 4px;
        overflow: hidden;
      }

      /* ----- Single day cell ----- */
      .day-cell {
        width: 44px;
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.88rem;
        font-weight: 600;
        color: #334155;
        font-variant-numeric: tabular-nums;
        transition:
          background 0.15s,
          color 0.15s;
        cursor: pointer;
        position: relative;
        background: #ffffff;
      }

      /* Empty cell — same background as others but muted number */
      .day-cell.empty {
        background: #ffffff;
        color: #e2e8f0;
        cursor: default;
      }

      .day-cell.empty:hover {
        background: #ffffff;
        color: #e2e8f0;
      }

      /* All real days — same base style, no disabled look */
      .day-cell:not(.empty):hover {
        background: #f1f5f9;
        color: #0f172a;
      }

      /* Weekend — same background, just slightly muted number */
      .day-cell.weekend {
        color: #64748b;
      }

      .day-cell.weekend:not(.empty):hover {
        color: #334155;
        background: #f1f5f9;
      }

      /* Past days — same neutral look */
      .day-cell.past {
        color: #334155;
      }

      .day-cell.past:hover {
        color: #0f172a;
        background: #f1f5f9;
      }

      /* Today — solid active background only, no shadows/blur/scale */
      .day-cell.today {
        background: linear-gradient(135deg, #6366f1, #a855f7);
        color: #ffffff;
        font-weight: 800;
        border-radius: 8px;
        z-index: 2;
      }

      .day-cell.today:hover {
        background: linear-gradient(135deg, #7c7ff2, #b96bff);
        color: #ffffff;
      }

      /* Uniform background — no odd-month tinting */
      .day-cell.tint-a {
        background: #ffffff;
      }
      .day-cell.tint-a:not(.empty):hover {
        background: #f1f5f9;
      }

      /* ----- Legend ----- */
      .legend {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 20px 28px 0;
        flex-wrap: wrap;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        color: #64748b;
        font-weight: 500;
      }

      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
      }

      .legend-swatch.today-swatch {
        background: linear-gradient(135deg, #6366f1, #a855f7);
      }

      .legend-swatch.weekend-swatch {
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
      }

      .legend-swatch.month-swatch {
        width: 4px;
        height: 16px;
        background: #a855f7;
        border-radius: 2px;
      }

      /* ----- Responsive ----- */
      @media (max-width: 768px) {
        body {
          padding: 16px 0 30px;
        }

        .app-header {
          padding: 0 16px;
          margin-bottom: 18px;
        }

        .app-title h1 {
          font-size: 1.15rem;
        }

        .app-title .logo {
          width: 38px;
          height: 38px;
          font-size: 18px;
          border-radius: 11px;
        }

        .app-title .subtitle {
          font-size: 0.6rem;
        }

        .year-controls-wrap {
          padding: 5px 5px 5px 16px;
        }

        .year-controls-wrap .current-year {
          font-size: 0.95rem;
        }

        .year-nav button {
          width: 30px;
          height: 30px;
          font-size: 14px;
        }

        .today-button {
          padding: 8px 18px;
          font-size: 0.72rem;
        }

        .scroll-hint {
          padding: 0 16px;
          font-size: 0.66rem;
        }

        .year-grid {
          padding: 0 16px;
        }

        .calendar-scroll::-webkit-scrollbar-track {
          margin: 0 16px;
        }

        .weekday-labels {
          padding-right: 10px;
          padding-left: 4px;
          margin-right: 4px;
        }

        .weekday-labels .spacer {
          height: 36px;
        }

        .weekday-labels .label-cell {
          height: 52px;
          font-size: 0.6rem;
          padding-left: 6px;
          padding-right: 12px;
        }

        .month-marker-header {
          height: 36px;
          font-size: 0.72rem;
          padding-left: 8px;
        }

        .day-cell {
          width: 38px;
          height: 52px;
          font-size: 0.78rem;
        }
      }

      @media (max-width: 480px) {
        .app-header {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }

        .app-title {
          justify-content: flex-start;
        }

        .year-controls-wrap {
          align-self: flex-end;
        }

        .today-button {
          align-self: stretch;
          text-align: center;
        }

        .weekday-labels {
          padding-right: 8px;
          padding-left: 2px;
          margin-right: 2px;
        }

        .weekday-labels .spacer {
          height: 32px;
        }

        .weekday-labels .label-cell {
          height: 46px;
          font-size: 0.55rem;
          padding-left: 4px;
          padding-right: 10px;
        }

        .month-marker-header {
          height: 32px;
          font-size: 0.65rem;
          letter-spacing: 0.12em;
          padding-left: 6px;
        }

        .day-cell {
          width: 34px;
          height: 46px;
          font-size: 0.72rem;
        }

        .legend {
          gap: 14px;
          padding: 16px 16px 0;
        }

        .legend-item {
          font-size: 0.68rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="app-header">
      <div class="app-title">
        <div class="logo">📆</div>
        <div>
          <h1>Year Grid</h1>
          <div class="subtitle">Continuous Months</div>
        </div>
      </div>

      <div class="year-controls-wrap">
        <span class="current-year" id="displayYear">2026</span>
        <div class="year-nav">
          <button id="prevYear" aria-label="Previous year">‹</button>
          <button id="nextYear" aria-label="Next year">›</button>
        </div>
      </div>

      <button class="today-button" id="jumpTodayBtn">📍 Jump to Today</button>
    </header>

    <!-- Scroll hint -->
    <div class="scroll-hint">
      <span>⟷</span> Scroll horizontally to travel through the year
    </div>

    <!-- Main calendar scroll wrapper -->
    <div class="calendar-scroll" id="calendarScroll">
      <div class="year-grid" id="yearGrid">
        <!-- Weekday labels (sticky left) -->
        <div class="weekday-labels">
          <div class="spacer"></div>
          <div class="label-cell">Mon</div>
          <div class="label-cell">Tue</div>
          <div class="label-cell">Wed</div>
          <div class="label-cell">Thu</div>
          <div class="label-cell">Fri</div>
          <div class="label-cell weekend">Sat</div>
          <div class="label-cell weekend">Sun</div>
        </div>

        <!-- Months will be generated here -->
        <div class="weeks-grid" id="weeksGrid"></div>
      </div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-swatch today-swatch"></div>
        <span>Today</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch weekend-swatch"></div>
        <span>Weekend</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch month-swatch"></div>
        <span>Month</span>
      </div>
    </div>

    <script>
      (function () {
        const weeksGrid = document.getElementById("weeksGrid");
        const calendarScroll = document.getElementById("calendarScroll");
        const displayYear = document.getElementById("displayYear");
        const prevYear = document.getElementById("prevYear");
        const nextYear = document.getElementById("nextYear");
        const jumpTodayBtn = document.getElementById("jumpTodayBtn");

        const MONTHS = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];

        let layoutInfo = null;
        let currentYear = new Date().getFullYear();

        function getDayCellWidth() {
          const tempCell = document.createElement("div");
          tempCell.className = "day-cell";
          tempCell.style.visibility = "hidden";
          tempCell.style.position = "absolute";
          tempCell.style.pointerEvents = "none";
          document.body.appendChild(tempCell);
          const width = tempCell.getBoundingClientRect().width;
          document.body.removeChild(tempCell);
          return width;
        }

        function computeLayout(year) {
          const startOfYear = new Date(year, 0, 1);
          const endOfYear = new Date(year, 11, 31);
          const startOffset = (startOfYear.getDay() + 6) % 7;

          const days = [];

          for (let i = 0; i < startOffset; i++) {
            days.push({ empty: true, date: null, month: 0, day: 0 });
          }

          let cursor = new Date(year, 0, 1);
          while (cursor <= endOfYear) {
            days.push({
              empty: false,
              date: new Date(cursor),
              month: cursor.getMonth(),
              day: cursor.getDate(),
            });
            cursor.setDate(cursor.getDate() + 1);
          }

          while (days.length % 7 !== 0) {
            days.push({ empty: true, date: null, month: 11, day: 0 });
          }

          const totalWeeks = days.length / 7;

          const monthStartInfo = {};
          for (let i = 0; i < days.length; i++) {
            const d = days[i];
            if (!d.empty && d.day === 1) {
              monthStartInfo[d.month] = { weekIndex: Math.floor(i / 7) };
            }
          }

          const monthOrder = [];
          for (let m = 0; m < 12; m++) {
            if (monthStartInfo[m] !== undefined) monthOrder.push(m);
          }

          const monthWeeks = new Array(12).fill(0);
          for (let i = 0; i < monthOrder.length; i++) {
            const m = monthOrder[i];
            const startWeek = monthStartInfo[m].weekIndex;
            const endWeek =
              i + 1 < monthOrder.length
                ? monthStartInfo[monthOrder[i + 1]].weekIndex
                : totalWeeks;
            monthWeeks[m] = endWeek - startWeek;
          }

          return { days, totalWeeks, monthOrder, monthWeeks, startOffset };
        }

        function renderYear() {
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const todayYear = today.getFullYear();
          const todayMonth = today.getMonth();
          const todayDate = today.getDate();

          displayYear.textContent = currentYear;
          weeksGrid.innerHTML = "";

          const info = computeLayout(currentYear);
          layoutInfo = info;

          const { days, totalWeeks, monthOrder, monthWeeks } = info;

          const fragment = document.createDocumentFragment();

          const weeksRow = document.createElement("div");
          weeksRow.className = "weeks-row";

          for (let w = 0; w < totalWeeks; w++) {
            const weekCol = document.createElement("div");
            weekCol.className = "week-col";

            for (let d = 0; d < 7; d++) {
              const dayInfo = days[w * 7 + d];
              const cell = document.createElement("div");
              cell.className = "day-cell";

              if (dayInfo.empty) {
                cell.classList.add("empty");
                cell.textContent = "";
              } else {
                cell.textContent = dayInfo.day;

                if (d === 5 || d === 6) cell.classList.add("weekend");

                if (dayInfo.date < today) {
                  cell.classList.add("past");
                } else if (
                  currentYear === todayYear &&
                  dayInfo.month === todayMonth &&
                  dayInfo.day === todayDate
                ) {
                  cell.classList.add("today");
                  cell.dataset.today = "true";
                }
              }

              weekCol.appendChild(cell);
            }

            weeksRow.appendChild(weekCol);
          }

          const monthHeaderRow = document.createElement("div");
          monthHeaderRow.className = "month-header-row";
          monthHeaderRow.style.display = "flex";

          for (let i = 0; i < monthOrder.length; i++) {
            const m = monthOrder[i];
            const weeksSpan = monthWeeks[m];

            const header = document.createElement("div");
            header.className = "month-marker-header";
            header.textContent = MONTHS[m];
            header.style.width = weeksSpan * 44 + "px";
            header.style.flex = "0 0 auto";
            header.style.boxSizing = "border-box";
            header.dataset.month = m;
            header.dataset.weeksSpan = weeksSpan;
            monthHeaderRow.appendChild(header);
          }

          const gridWrapper = document.createElement("div");
          gridWrapper.style.display = "flex";
          gridWrapper.style.flexDirection = "column";

          gridWrapper.appendChild(monthHeaderRow);
          gridWrapper.appendChild(weeksRow);
          fragment.appendChild(gridWrapper);

          weeksGrid.appendChild(fragment);

          requestAnimationFrame(() => {
            syncMonthHeaderWidths();

            if (currentYear === todayYear) {
              const todayCell = weeksGrid.querySelector(".day-cell.today");
              if (todayCell) {
                const rect = todayCell.getBoundingClientRect();
                const scrollRect = calendarScroll.getBoundingClientRect();
                const offset =
                  rect.left -
                  scrollRect.left +
                  calendarScroll.scrollLeft -
                  calendarScroll.clientWidth / 2 +
                  rect.width / 2;
                calendarScroll.scrollLeft = offset;
              }
            } else {
              calendarScroll.scrollLeft = 0;
            }
          });
        }

        function syncMonthHeaderWidths() {
          if (!layoutInfo) return;
          const headers = weeksGrid.querySelectorAll(".month-marker-header");
          if (!headers.length) return;

          const actualCellWidth = getDayCellWidth();
          // Add 1px for the gap between cells in a week column,
          // so each month header spans weeks correctly
          const cellSpan = actualCellWidth + 1;

          headers.forEach((h) => {
            const weeksSpan = Number(h.dataset.weeksSpan);
            h.style.width = weeksSpan * cellSpan + "px";
          });
        }

        prevYear.addEventListener("click", () => {
          currentYear--;
          renderYear();
        });

        nextYear.addEventListener("click", () => {
          currentYear++;
          renderYear();
        });

        jumpTodayBtn.addEventListener("click", () => {
          currentYear = new Date().getFullYear();
          renderYear();
        });

        let isDown = false;
        let startX = 0;
        let startScrollLeft = 0;

        calendarScroll.addEventListener("mousedown", (e) => {
          isDown = true;
          calendarScroll.style.cursor = "grabbing";
          startX = e.pageX;
          startScrollLeft = calendarScroll.scrollLeft;
        });

        window.addEventListener("mouseup", () => {
          isDown = false;
          calendarScroll.style.cursor = "grab";
        });

        window.addEventListener("mousemove", (e) => {
          if (!isDown) return;
          e.preventDefault();
          const walk = (e.pageX - startX) * 1.4;
          calendarScroll.scrollLeft = startScrollLeft - walk;
        });

        let resizeTimer;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(syncMonthHeaderWidths, 120);
        });

        renderYear();
      })();
    </script>
  </body>
</html>
